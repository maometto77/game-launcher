    <path d="M68 162 H132 V186 C132 201 119 210 100 217 C81 210 68 201 68 186 Z" fill="#DC2626"/>
    <path d="M132 162 V186 C132 201 119 210 100 217 V162 Z" fill="#09090B" opacity="0.22"/>
  </g>

  <text x="230" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="64"
