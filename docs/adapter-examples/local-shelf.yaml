# A catalogue held entirely on this machine — no server, no network.
#
# Copy this file and shelf.json into %LOCALAPPDATA%\Don\adapters\.
#
# 'request.url' has no scheme, so it names a file beside this manifest. That is
# the whole mechanism: a JSON file you maintain by hand, read when a listing
# from the matching host is installed. Paths that climb out of the adapter
# folder are refused.
#
# The host in 'match.hosts' does not have to exist. It is the label your
# catalogue listings carry, and this manifest claims it.

key: shelf
displayName: The shelf
enabled: true

match:
  hosts: [shelf.local]

request:
  url: shelf.json

format: json
items: games

map:
  url: url
  fileName: file
  sizeBytes: size
  sha1: sha1
  title: title
